<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>경기초 5학년 과학실험실 | 바람 발생 모형실험</title>
<style>
:root{
  --ink:#17324d; --muted:#6a7f93; --sky:#eaf8ff; --card:#ffffff;
  --line:#cce7f6; --accent:#1f88d6; --accent2:#54b8e9; --ok:#22a06b; --warn:#ef8b2c;
  --shadow:0 16px 40px rgba(26,91,133,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(180deg,#dff5ff 0,#f8fcff 44%,#eef8ff 100%)}
body{overflow-x:hidden}
button,input{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}
.fadeIn{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:.2}65%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{50%{filter:brightness(1.15);transform:scale(1.02)}}

#app{min-height:100vh}
.hero{min-height:100vh;display:grid;place-items:center;padding:26px}
.hero-card{width:min(760px,100%);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.95);border-radius:30px;padding:38px;box-shadow:var(--shadow);text-align:center}
.school{display:inline-flex;gap:8px;align-items:center;border-radius:99px;background:#e6f6ff;padding:8px 14px;color:#166da7;font-weight:800;font-size:14px}
h1{font-size:clamp(30px,6vw,52px);margin:16px 0 8px;letter-spacing:-2px}
.subtitle{font-size:18px;color:var(--muted);line-height:1.65;margin:0 auto 28px;max-width:590px}
.profile{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px;margin:22px auto;max-width:560px}
.profile input{width:100%;border:1.5px solid #cde4f2;border-radius:15px;padding:14px;background:white;text-align:center;font-weight:800;color:var(--ink);outline:0}
.profile input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(31,136,214,.1)}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:17px;padding:15px 26px;font-weight:900;font-size:17px;box-shadow:0 10px 22px rgba(31,136,214,.25)}
.primary:active{transform:translateY(1px)}
.hero-visual{height:150px;position:relative;margin:14px auto 8px;max-width:560px;overflow:hidden;border-radius:24px;background:linear-gradient(#d6f3ff 0 65%,#f2d4a5 65%)}
.hero-water,.hero-sand{position:absolute;bottom:12px;width:150px;height:58px;border-radius:14px 14px 18px 18px;border:3px solid rgba(23,50,77,.25)}
.hero-water{left:14%;background:linear-gradient(#8bd8ff 16%,#36a9e8 17%)}
.hero-sand{right:14%;background:linear-gradient(#f6d49a,#d8a259)}
.hero-smoke{position:absolute;left:49%;bottom:55px;width:8px;height:65px;border-radius:50%;background:linear-gradient(transparent,rgba(90,101,112,.45),transparent);filter:blur(3px);transform:skewX(-18deg)}
.hero-arrow{position:absolute;left:31%;top:34px;width:35%;font-size:38px;color:#1483c6;animation:pulse 1.5s infinite;text-align:center}

.lab-page{display:none;min-height:100vh;padding:18px 18px 42px}
.topbar{width:min(1180px,100%);margin:0 auto 14px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-weight:950;font-size:18px}.brand small{font-weight:700;color:var(--muted);margin-left:8px}
.progress-wrap{flex:1;max-width:600px;height:12px;background:#dcecf6;border-radius:99px;overflow:hidden}
.progress{height:100%;width:0;background:linear-gradient(90deg,#52bce9,#1d83cf);transition:width .5s ease}
.step-pill{min-width:88px;text-align:right;color:#36708e;font-weight:900;font-size:14px}
.layout{width:min(1180px,100%);margin:auto;display:grid;grid-template-columns:280px 1fr;gap:16px}
.side,.main{background:rgba(255,255,255,.92);border:1px solid #d9eef9;border-radius:24px;box-shadow:0 12px 30px rgba(32,95,132,.10)}
.side{padding:20px;height:max-content;position:sticky;top:16px}
.side h2{margin:0 0 8px;font-size:20px}.side p{margin:0 0 15px;color:var(--muted);line-height:1.55;font-size:14px}
.steps{display:grid;gap:8px}
.step-row{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;color:#88a0b1;font-size:13px;font-weight:800}
.step-row .num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#edf5fa}
.step-row.active{background:#e9f7ff;color:#166da7}.step-row.active .num{background:#1684cd;color:white}
.step-row.done{color:#3e8c68}.step-row.done .num{background:#dff6e9;color:#168254}.step-row.done .num:before{content:'✓';font-size:13px}.step-row.done .num span{display:none}
.main{padding:18px;min-width:0}
.instruction{min-height:86px;border-radius:18px;background:linear-gradient(135deg,#edf9ff,#f7fcff);border:1px solid #d9eef9;padding:16px 18px;display:flex;gap:14px;align-items:center;margin-bottom:14px}
.instruction .badge{width:46px;height:46px;flex:none;border-radius:14px;background:white;display:grid;place-items:center;font-size:25px;box-shadow:0 6px 16px rgba(24,105,153,.10)}
.instruction h3{margin:0 0 3px;font-size:18px}.instruction p{margin:0;color:#597489;line-height:1.48;font-size:14px}
.status{margin-left:auto;white-space:nowrap;border-radius:99px;background:white;padding:7px 11px;color:#2a83b7;font-weight:900;font-size:12px}

.lab{position:relative;height:min(620px,66vh);min-height:490px;border-radius:22px;overflow:hidden;background:linear-gradient(#d7f2ff 0 68%,#e4c093 68% 71%,#b57c49 71%);border:2px solid #d5eaf5;touch-action:none;user-select:none}
.window{position:absolute;left:4%;top:5%;width:26%;height:36%;border:8px solid #fff;background:linear-gradient(#a9ddf8,#e8f8ff);box-shadow:0 3px 12px rgba(0,0,0,.08)}
.window:after{content:'';position:absolute;left:48%;top:0;width:5px;height:100%;background:white}.window:before{content:'';position:absolute;top:49%;left:0;width:100%;height:5px;background:white}
.lab-sign{position:absolute;right:4%;top:6%;background:white;border-radius:15px;padding:11px 15px;font-weight:900;color:#4c7188;box-shadow:0 5px 14px rgba(0,0,0,.08);font-size:13px}
.bench{position:absolute;left:4%;right:4%;bottom:5%;height:20%;border-radius:12px;background:linear-gradient(#e1b77f 0 18%,#b97843 18% 100%);box-shadow:0 9px 0 #8d5935}
.tank{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);width:min(64%,630px);height:46%;border:5px solid rgba(92,164,194,.45);border-top-color:rgba(92,164,194,.25);border-radius:9px 9px 22px 22px;background:linear-gradient(90deg,rgba(222,248,255,.15),rgba(255,255,255,.26));box-shadow:inset 0 -9px 20px rgba(63,148,188,.08);pointer-events:none}
.tank-label{position:absolute;left:50%;top:7px;transform:translateX(-50%);font-size:11px;color:#6f9db2;font-weight:900}

.tool{position:absolute;z-index:12;touch-action:none;cursor:grab;filter:drop-shadow(0 7px 5px rgba(20,64,88,.16));transition:opacity .3s ease}
.tool:active{cursor:grabbing}.tool.locked{cursor:default}
.tool-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:-25px;background:#fff;border:1px solid #d7e9f2;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:900;white-space:nowrap;color:#547287;box-shadow:0 5px 10px rgba(0,0,0,.06)}
.bowl{width:132px;height:85px;border:4px solid #607d8b;border-top:2px solid #86a4b2;border-radius:5px 5px 24px 24px;overflow:hidden;background:rgba(255,255,255,.5)}
.bowl .fill{position:absolute;left:4px;right:4px;bottom:4px;height:62px;border-radius:0 0 18px 18px}.bowl .label{position:absolute;left:50%;top:31px;transform:translateX(-50%);font-size:18px;font-weight:950;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.water .fill{background:linear-gradient(#95deff 0 10%,#39ace9 11%)}.water .label{color:#0d69a1}
.sand .fill{background:linear-gradient(#f1d08f,#d39a4c)}.sand .label{color:#76531e}
.incense{width:78px;height:92px}.clay{position:absolute;left:12px;bottom:0;width:54px;height:27px;border-radius:50% 50% 30% 30%;background:#6f88a0}.stick{position:absolute;left:37px;bottom:18px;width:5px;height:65px;background:#6d462c;border-radius:4px}.ember{position:absolute;left:35px;top:3px;width:9px;height:9px;border-radius:50%;background:#e84628;box-shadow:0 0 11px #ffb13b;display:none}
.lamp{width:120px;height:190px}.lamp .shade{position:absolute;left:19px;top:0;width:82px;height:57px;background:#455c6d;clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);border-radius:7px}.lamp .bulb{position:absolute;left:48px;top:46px;width:24px;height:35px;border-radius:50% 50% 46% 46%;background:#d9e1e5;box-shadow:none}.lamp.on .bulb{background:#fff5a6;box-shadow:0 0 28px 14px rgba(255,222,95,.62)}.lamp.on .beam{opacity:1}.beam{position:absolute;left:26px;top:72px;width:68px;height:78px;background:linear-gradient(rgba(255,226,108,.36),transparent);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);opacity:0}.stand{position:absolute;left:57px;top:58px;width:6px;height:112px;background:#546b7a}.base{position:absolute;left:27px;bottom:0;width:66px;height:10px;border-radius:50%;background:#4f6472}.switch{position:absolute;right:3px;top:91px;width:27px;height:27px;border-radius:50%;background:#d7e1e7;border:3px solid #607b8c;display:grid;place-items:center;font-size:11px;color:#435b6a;font-weight:950}
.thermo{width:44px;height:172px}.thermo .glass{position:absolute;left:16px;top:0;width:13px;height:132px;border-radius:8px;background:#f3f7f9;border:3px solid #7b909d}.thermo .red{position:absolute;left:20px;bottom:39px;width:5px;height:56px;background:#e94848;border-radius:4px;transition:height .4s}.thermo .bulb2{position:absolute;left:12px;bottom:21px;width:22px;height:22px;border-radius:50%;background:#e94848;border:3px solid #7b909d}.tempbadge{position:absolute;left:39px;top:35px;background:white;border-radius:10px;padding:6px 8px;font-weight:950;color:#d84848;box-shadow:0 5px 12px rgba(0,0,0,.1);white-space:nowrap}
.lighter{width:70px;height:78px}.lighter .body{position:absolute;left:17px;bottom:0;width:35px;height:55px;border-radius:7px;background:linear-gradient(#f89e4b,#e76e2b)}.lighter .head{position:absolute;left:21px;top:3px;width:27px;height:25px;border-radius:4px;background:#8a9aa4}.lighter .flame{position:absolute;left:27px;top:-9px;width:15px;height:24px;border-radius:70% 30% 70% 30%;transform:rotate(45deg);background:#ffd95b;box-shadow:0 0 10px #ffb23a;display:none}
.blackpaper{width:270px;height:190px;background:#171d22;border:5px solid #303a42;border-radius:7px;display:grid;place-items:center;color:#d9e3e9;font-weight:900;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.22)}
#paper.paper-installed{left:7%!important;top:7%!important;width:86%!important;height:55%!important;z-index:2!important;filter:drop-shadow(0 10px 12px rgba(0,0,0,.24))}
#paper.paper-installed .blackpaper{width:100%;height:100%;border-width:6px;border-radius:10px;background:linear-gradient(145deg,#101418,#232a30);font-size:16px}
#paper.paper-installed .tool-hint{display:none}

.dropzone{position:absolute;z-index:5;border:3px dashed rgba(35,136,195,.38);border-radius:16px;background:rgba(212,243,255,.25);display:grid;place-items:center;color:#4384a7;font-weight:950;font-size:12px;pointer-events:none;animation:pulse 1.6s infinite}
.dropzone.ok{border-color:rgba(34,160,107,.6);background:rgba(218,250,234,.26);color:#22835e}

.timer-card{position:absolute;z-index:30;left:50%;top:13%;transform:translateX(-50%);background:rgba(255,255,255,.94);border-radius:18px;padding:12px 18px;text-align:center;box-shadow:0 10px 26px rgba(28,84,119,.17);min-width:170px}
.timer-num{font-size:30px;font-weight:950;color:#1479b9}.timer-txt{font-size:11px;color:#698293;font-weight:800}

.smoke-layer{position:absolute;z-index:18;inset:0;pointer-events:none;overflow:hidden}.smoke-dot{position:absolute;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,rgba(105,118,125,.54),rgba(124,137,143,.17) 55%,transparent 72%);filter:blur(1px);opacity:0}.smoke-layer.run .smoke-dot{animation:smokeMove 3.8s linear infinite}
@keyframes smokeMove{0%{opacity:0;transform:translate(0,0) scale(.65)}12%{opacity:.7}60%{opacity:.48}100%{opacity:0;transform:translate(245px,-75px) scale(1.55)}}
.wind-arrow{position:absolute;z-index:21;left:31%;top:41%;width:37%;height:56px;opacity:0;pointer-events:none}.wind-arrow.show{opacity:1;animation:fadeIn .5s both}.wind-arrow .line{position:absolute;left:0;right:18px;top:25px;height:7px;border-radius:99px;background:#2f9bd8}.wind-arrow .head{position:absolute;right:0;top:10px;width:0;height:0;border-top:18px solid transparent;border-bottom:18px solid transparent;border-left:28px solid #2f9bd8}.wind-arrow span{position:absolute;top:-9px;width:100%;text-align:center;color:#1479b9;font-weight:950;font-size:13px}
.pressure{position:absolute;z-index:20;border-radius:99px;padding:7px 11px;font-weight:950;font-size:13px;background:white;box-shadow:0 5px 12px rgba(0,0,0,.1);opacity:0;transition:.4s}.pressure.show{opacity:1}.high{color:#2365b6}.low{color:#d45d35}

.toast{position:absolute;z-index:100;left:50%;bottom:26%;transform:translateX(-50%);background:#18394e;color:white;padding:10px 16px;border-radius:99px;font-weight:900;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,-5px)}

.question{margin-top:15px;border:1px solid #dceef7;border-radius:18px;padding:17px;background:#fbfeff}.question h3{margin:0 0 12px;font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{padding:13px;border-radius:14px;background:#eff8fd;color:#335e76;font-weight:850;border:2px solid transparent}.choice:hover{border-color:#9bd2ef}.choice.correct{background:#e1f7eb;color:#18734f;border-color:#7ed2a8}.choice.wrong{background:#fff0ec;color:#b54d32;border-color:#f2ab99}
.result{margin-top:16px;border-radius:20px;padding:20px;background:linear-gradient(135deg,#eaf9ff,#f5fffb);border:1px solid #ceeaf1}.result h2{margin:0 0 7px}.result p{margin:5px 0;color:#4f7185;line-height:1.65}.night-btn{margin-top:12px;background:#425b87;color:white;border-radius:14px;padding:11px 15px;font-weight:900}
.night-mode .lab{background:linear-gradient(#182a4b 0 68%,#d2a370 68% 71%,#9b6238 71%)}.night-mode .window{background:linear-gradient(#1e3760,#53688b)}.night-mode .window:after,.night-mode .window:before{background:#dfeaf5}.night-mode .lab-sign{background:#263e5b;color:#dcecff}.night-mode .water .fill{background:linear-gradient(#8bc8e8 0 10%,#2e80b4 11%)}

@media(max-width:860px){
 .layout{grid-template-columns:1fr}.side{position:static;padding:14px}.side p{display:none}.steps{grid-template-columns:repeat(4,1fr)}.step-row{padding:7px 5px;justify-content:center}.step-row span.label{display:none}.main{padding:12px}.lab{height:560px}.topbar{flex-wrap:wrap}.progress-wrap{order:3;flex-basis:100%}.profile{grid-template-columns:1fr 1fr}.profile input:last-child{grid-column:1/-1}.hero-card{padding:28px 20px}
}
@media(max-width:560px){
 .lab{height:520px;min-height:520px}.instruction{align-items:flex-start}.instruction .status{display:none}.bowl{transform:scale(.85);transform-origin:center bottom}.lamp{transform:scale(.82);transform-origin:center bottom}.thermo{transform:scale(.88);transform-origin:center bottom}.blackpaper{transform:scale(.84);transform-origin:center}#paper.paper-installed .blackpaper{transform:none}.choices{grid-template-columns:1fr}.brand small{display:none}
}

/* ===== 심화 실험실 ===== */
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.advanced-btn{background:linear-gradient(135deg,#6a54d7,#876ee9);color:#fff;border-radius:14px;padding:11px 15px;font-weight:900;box-shadow:0 7px 16px rgba(93,72,191,.20)}
.advanced-lab{margin-top:18px;border:2px solid #d8d2ff;border-radius:24px;padding:18px;background:linear-gradient(180deg,#faf9ff,#f3fbff);box-shadow:0 14px 32px rgba(74,70,150,.10)}
.advanced-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.advanced-head h2{margin:0 0 4px;font-size:22px}.advanced-head p{margin:0;color:#65778b;line-height:1.55;font-size:14px}
.adv-tabs{display:flex;gap:7px;flex-wrap:wrap}.adv-tab{padding:9px 12px;border-radius:12px;background:#eef1f7;color:#607188;font-weight:900}.adv-tab.active{background:#654fd3;color:#fff}
.adv-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(270px,.85fr);gap:14px}
.adv-scene{position:relative;min-height:385px;border-radius:20px;overflow:hidden;border:1px solid #d8e9f3;background:linear-gradient(#cfeeff 0 64%,#e2bd8b 64% 69%,#b57947 69%);user-select:none}
.adv-window{position:absolute;left:5%;top:6%;width:22%;height:29%;border:6px solid white;background:linear-gradient(#a9dcf6,#eefaff);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.adv-bench{position:absolute;left:4%;right:4%;bottom:4%;height:21%;border-radius:10px;background:linear-gradient(#deb37b 0 18%,#ad7042 18%);box-shadow:0 8px 0 #865532}
.adv-tank{position:absolute;left:15%;right:15%;bottom:24%;height:47%;border:4px solid rgba(84,159,191,.38);border-radius:8px 8px 18px 18px;background:rgba(236,251,255,.22)}
.adv-bowl{position:absolute;bottom:9%;width:29%;height:82px;border:4px solid #617c8a;border-radius:5px 5px 22px 22px;overflow:hidden;background:rgba(255,255,255,.5);z-index:3}.adv-bowl.water{left:10%}.adv-bowl.sand{right:10%}.adv-bowl:before{content:'';position:absolute;left:4px;right:4px;bottom:4px;height:58px;border-radius:0 0 16px 16px}.adv-bowl.water:before{background:linear-gradient(#97dfff 0 10%,#3cacE8 11%)}.adv-bowl.sand:before{background:linear-gradient(#f1d18f,#d49b4f)}
.adv-bowl b{position:absolute;z-index:2;left:50%;top:31px;transform:translateX(-50%);font-size:17px}.adv-bowl.water b{color:#096ca5}.adv-bowl.sand b{color:#76541f}
.adv-temp{position:absolute;top:-45px;left:50%;transform:translateX(-50%);background:white;border-radius:11px;padding:7px 9px;white-space:nowrap;font-weight:950;box-shadow:0 5px 13px rgba(0,0,0,.12)}
.adv-lamp{position:absolute;left:50%;top:2%;transform:translateX(-50%);width:112px;height:125px;z-index:5;transition:top .35s ease,filter .35s ease}.adv-lamp .shade{position:absolute;left:16px;top:0;width:80px;height:48px;background:#455c6d;clip-path:polygon(23% 0,77% 0,100% 100%,0 100%);border-radius:6px}.adv-lamp .bulb{position:absolute;left:43px;top:40px;width:26px;height:30px;border-radius:50%;background:#fff3a0;box-shadow:0 0 28px 13px rgba(255,219,82,.62)}.adv-lamp .beam{position:absolute;left:19px;top:62px;width:75px;height:86px;background:linear-gradient(rgba(255,225,102,.38),transparent);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%)}
.adv-cold{position:absolute;inset:0;background:linear-gradient(rgba(188,229,255,.12),rgba(202,237,255,.26));opacity:0;pointer-events:none;transition:.4s;z-index:1}.adv-cold.show{opacity:1}.snowflake{position:absolute;font-size:22px;animation:snow 3s linear infinite;opacity:.72}@keyframes snow{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(400px) rotate(180deg)}}
.adv-incense{position:absolute;z-index:4;left:49%;bottom:8%;width:4px;height:65px;background:#6e4931;border-radius:4px}.adv-incense:before{content:'';position:absolute;left:-19px;bottom:-2px;width:43px;height:18px;border-radius:50%;background:#728a9f}.adv-ember{position:absolute;left:-3px;top:-4px;width:10px;height:10px;border-radius:50%;background:#e84929;box-shadow:0 0 12px #ffb547}
.adv-smoke{position:absolute;inset:0;z-index:7;pointer-events:none}.adv-smoke i{position:absolute;left:50%;top:55%;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle,rgba(95,109,116,.56),rgba(120,133,139,.17) 58%,transparent 72%);opacity:0}
.adv-arrow{position:absolute;z-index:8;left:29%;top:40%;width:42%;height:48px;opacity:0;transition:.35s}.adv-arrow.show{opacity:1}.adv-arrow .aline{position:absolute;left:0;right:16px;top:21px;height:7px;border-radius:99px;background:#2f9bd8}.adv-arrow .ahead{position:absolute;right:0;top:6px;border-top:17px solid transparent;border-bottom:17px solid transparent;border-left:26px solid #2f9bd8}.adv-arrow.reverse .ahead{left:0;right:auto;border-left:0;border-right:26px solid #775fd6}.adv-arrow.reverse .aline{background:#775fd6}.adv-arrow.none .aline{background:#91a6b3;height:5px}.adv-arrow.none .ahead{display:none}.adv-arrow span{position:absolute;top:-10px;width:100%;text-align:center;font-weight:950;color:#286f9c;font-size:13px}.adv-arrow.reverse span{color:#6250bd}.adv-arrow.none span{color:#718694}
.adv-env-label{position:absolute;right:4%;top:5%;z-index:6;background:white;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:950;box-shadow:0 5px 13px rgba(0,0,0,.08)}
.adv-controls{background:white;border:1px solid #dcecf5;border-radius:19px;padding:15px;display:grid;gap:13px;align-content:start}.adv-controls h3{margin:0;font-size:18px}.adv-note{font-size:12px;line-height:1.55;color:#718496;background:#f4f8fb;border-radius:12px;padding:10px}
.control-row label{display:flex;justify-content:space-between;gap:12px;font-weight:900;font-size:13px;margin-bottom:6px}.control-row output{color:#634fd1}.control-row input[type=range]{width:100%;accent-color:#654fd3}
.mode-explain{border-radius:13px;background:#f1efff;color:#5e55a1;padding:10px;font-size:13px;line-height:1.55;font-weight:750}
.predict-box{border-top:1px dashed #d7e4ec;padding-top:11px}.predict-box b{font-size:13px}.predict-choices{display:grid;grid-template-columns:1fr;gap:7px;margin-top:8px}.predict{padding:10px;border-radius:11px;background:#edf6fb;color:#406678;font-weight:850;border:2px solid transparent}.predict.selected{border-color:#806be0;background:#f0edff;color:#5949b0}
.adv-run{padding:13px;border-radius:14px;background:linear-gradient(135deg,#654fd3,#8b73ec);color:#fff;font-weight:950;font-size:15px}.adv-run:disabled{opacity:.5;cursor:default}.adv-reset{padding:10px;border-radius:12px;background:#edf4f8;color:#557083;font-weight:900}
.adv-result{border-radius:15px;padding:12px;background:#eefaf5;border:1px solid #ccebdd;line-height:1.6;color:#456d5d;font-size:13px}.adv-result strong{color:#236e51}.adv-result.warning{background:#fff8e8;border-color:#f1dfad;color:#826d3f}
.adv-challenge{margin-top:12px;border-radius:15px;padding:12px;background:#fff8e9;border:1px solid #f0d99e;color:#80652c;font-size:13px;line-height:1.55}
@media(max-width:800px){.adv-grid{grid-template-columns:1fr}.adv-scene{min-height:360px}.result-actions{display:grid;grid-template-columns:1fr 1fr}.night-btn,.advanced-btn{margin-top:0}}
@media(max-width:520px){.adv-scene{min-height:330px}.adv-bowl{width:31%;height:72px}.adv-temp{font-size:12px}.adv-lamp{transform:translateX(-50%) scale(.85);transform-origin:top center}.result-actions{grid-template-columns:1fr}}

.simple-situation{border-radius:13px;background:#f7fbfe;border:1px dashed #cddfea;padding:11px 12px;color:#587384;font-size:13px;line-height:1.55;font-weight:800;text-align:center}

<body>
<div class="global-nav"><button id="experimentMenuBtn" type="button">🧪 실험 선택</button><button id="windRestartBtn" type="button">↺ 처음부터</button></div>
<div id="app">
<section class="hero" id="hero">
  <div class="hero-card">
    <div class="school">🔬 경기초 5학년 과학실험</div>
    <h1>바람은 왜 생길까?</h1>
    <p class="subtitle">교과서처럼 <b>따뜻한 물과 차가운 모래</b>를 이용해 향 연기가 움직이는 방향을 관찰하고, <b>바람이 부는 까닭</b>을 찾아보자.</p>
    <div class="hero-visual" aria-hidden="true"><div class="hero-water"></div><div class="hero-sand"></div><div class="hero-smoke"></div><div class="hero-arrow">→</div></div>
    <div class="profile">
      <input id="classInput" inputmode="numeric" placeholder="반" maxlength="2" />
      <input id="numInput" inputmode="numeric" placeholder="번호" maxlength="2" />
      <input id="nameInput" placeholder="이름" maxlength="8" />
    </div>
    <button class="primary" id="startBtn">실험실 입장하기 →</button>
  </div>
</section>

<section class="lab-page" id="labPage">
  <div class="topbar">
    <div class="brand">경기초 5학년 과학실험 <small>바람 발생 모형실험</small></div>
    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    <div class="step-pill" id="stepPill">1 / 5</div>
  </div>
  <div class="layout">
    <aside class="side">
      <h2>실험 순서</h2>
      <p>현재 단계에 필요한 도구만 실험대에 나타나. 직접 옮기고 설치해 보자!</p>
      <div class="steps" id="steps"></div>
    </aside>
    <main class="main">
      <div class="instruction">
        <div class="badge" id="instIcon">🧪</div>
        <div><h3 id="instTitle">물과 모래 준비하기</h3><p id="instText"></p></div>
        <div class="status" id="status">직접 드래그</div>
      </div>
      <div class="lab" id="lab">
        <div class="window"></div><div class="lab-sign">📘 교과서 모형 · 따뜻한 물 + 차가운 모래</div><div class="bench"></div>
        <div class="tank"><div class="tank-label">투명 수조</div></div>
        <div class="smoke-layer" id="smokeLayer"></div>
        <div class="wind-arrow" id="windArrow"><span>공기의 이동 = 바람</span><div class="line"></div><div class="head"></div></div>
        <div class="pressure high" id="highP">고기압 · 차가운 모래 쪽</div><div class="pressure low" id="lowP">저기압 · 따뜻한 물 쪽</div>
        <div class="toast" id="toast"></div>
      </div>
      <div id="questionArea"></div>
    </main>
  </div>
</section>
</div>
<script>
(() => {
const $=s=>document.querySelector(s), lab=$('#lab');
const STEPS=[
 ['🧪','따뜻한 물과 모래 준비하기','교과서처럼 따뜻한 물이 든 그릇과 모래가 든 그릇을 수조 안에 직접 놓아 보자.'],
 ['🌫️','향 설치하기','향을 두 그릇 사이 한가운데에 세워 보자.'],
 ['⬛','검은 종이 설치하기','향 연기가 잘 보이도록 검은 종이를 수조 뒤쪽에 직접 놓아 보자.'],
 ['🕯️','향에 불 붙이기','점화기를 향 끝으로 가져가 불을 붙여 보자.'],
 ['👀','향 연기 관찰하기','향 연기가 어느 쪽으로 이동하는지 잠시 관찰해 보자.']
];
let step=0, placed={}, tools={};
function initSteps(){ $('#steps').innerHTML=STEPS.map((s,i)=>`<div class="step-row" data-i="${i}"><div class="num"><span>${i+1}</span></div><span class="label">${s[1]}</span></div>`).join(''); }
function updateUI(){
 document.querySelectorAll('.step-row').forEach((r,i)=>{r.classList.toggle('done',i<step);r.classList.toggle('active',i===step)});
 $('#progress').style.width=((step)/STEPS.length*100)+'%'; $('#stepPill').textContent=(step>=STEPS.length?'완료':`${step+1} / ${STEPS.length}`);
 const s=STEPS[Math.min(step,STEPS.length-1)]; $('#instIcon').textContent=s[0]; $('#instTitle').textContent=s[1]; $('#instText').textContent=s[2];
 $('#status').textContent=step===4?'직접 관찰':'직접 드래그';
}
function toast(msg,ms=1300){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms)}
function delayNext(ms=1500){setTimeout(()=>{step++;updateUI();spawnStep();},ms)}
function clearZones(){lab.querySelectorAll('.dropzone').forEach(e=>e.remove())}
function zone(id,x,y,w,h,label){const z=document.createElement('div');z.className='dropzone fadeIn';z.id=id;Object.assign(z.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});z.textContent=label;lab.appendChild(z);return z}
function addTool(id,html,cls,x,y){let el=document.createElement('div');el.id=id;el.className='tool fadeIn '+(cls||'');el.innerHTML=html;el.style.left=x+'%';el.style.top=y+'%';lab.appendChild(el);tools[id]=el;makeDrag(el);return el}
function makeDrag(el){let sx,sy,sl,st,m=false;el.addEventListener('pointerdown',e=>{if(el.classList.contains('locked'))return;m=true;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;sl=parseFloat(el.style.left)||0;st=parseFloat(el.style.top)||0;el.style.zIndex=50;e.preventDefault()});el.addEventListener('pointermove',e=>{if(!m)return;const r=lab.getBoundingClientRect();el.style.left=(sl+(e.clientX-sx)/r.width*100)+'%';el.style.top=(st+(e.clientY-sy)/r.height*100)+'%';e.preventDefault()});el.addEventListener('pointerup',()=>{if(!m)return;m=false;el.style.zIndex=12;checkDrop(el)})}
function overlap(el,z,ratio=.25){if(!z)return false;let a=el.getBoundingClientRect(),b=z.getBoundingClientRect();let x=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left));let y=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));return x*y/(a.width*a.height)>ratio}
function snap(el,z,dx=0,dy=0){let lr=lab.getBoundingClientRect(),zr=z.getBoundingClientRect();el.style.left=((zr.left-lr.left+zr.width/2-el.offsetWidth/2)/lr.width*100+dx)+'%';el.style.top=((zr.top-lr.top+zr.height/2-el.offsetHeight/2)/lr.height*100+dy)+'%';el.classList.add('locked')}
function hint(txt){return `<div class="tool-hint">${txt}</div>`}
function bowl(kind,label,temp){return `<div class="bowl ${kind}"><div class="fill"></div><div class="label" style="top:20px;font-size:15px;line-height:1.1;text-align:center">${label}<br><small style="font-size:12px">${temp}</small></div></div>${hint('잡아서 옮기기')}`}
function incense(){return `<div class="incense"><div class="clay"></div><div class="stick"></div><div class="ember"></div></div>${hint('가운데 세우기')}`}
function lighter(){return `<div class="lighter"><div class="flame"></div><div class="head"></div><div class="body"></div></div>${hint('향 끝에 가져가기')}`}
function spawnStep(){
 clearZones();
 if(step===0){placed={};zone('zs',31,48,16,22,'모래');zone('zw',54,48,16,22,'따뜻한 물');addTool('sand',bowl('sand','모래','약 19℃'),'',7,67);addTool('water',bowl('water','따뜻한 물','약 33℃'),'',79,67)}
 if(step===1){zone('zi',48,43,6,28,'향');addTool('incense',incense(),'',8,58)}
 if(step===2){zone('zpaper',10,8,80,48,'검은 종이를 수조 뒤쪽 배경에 놓기');addTool('paper','<div class="blackpaper">검은색 종이</div>'+hint('수조 뒤에 놓기'),'',5,31)}
 if(step===3){addTool('lighter',lighter(),'',7,60)}
 if(step===4){toast('연기의 움직임을 5초 동안 관찰해 보자!',1600);setTimeout(runSmoke,900)}
}
function checkDrop(el){
 if(step===0){if(el.id==='sand'&&overlap(el,$('#zs'))){snap(el,$('#zs'));placed.sand=1;$('#zs').classList.add('ok');toast('차가운 모래 쪽 설치 완료!')}if(el.id==='water'&&overlap(el,$('#zw'))){snap(el,$('#zw'));placed.water=1;$('#zw').classList.add('ok');toast('따뜻한 물 쪽 설치 완료!')}if(placed.sand&&placed.water){clearZones();setTimeout(()=>{toast('온도 차가 있는 두 곳을 만들었어.',1500);delayNext(1700)},350)}}
 else if(step===1&&el.id==='incense'&&overlap(el,$('#zi'))){snap(el,$('#zi'));$('#zi').classList.add('ok');clearZones();toast('향을 두 곳 사이에 세웠어.',1500);delayNext(1700)}
 else if(step===2&&el.id==='paper'&&overlap(el,$('#zpaper'),.12)){el.classList.add('locked','paper-installed');$('#zpaper').classList.add('ok');clearZones();toast('검은 종이가 수조 뒤쪽을 크게 가려 연기가 더 잘 보여!',1700);delayNext(1900)}
 else if(step===3&&el.id==='lighter'){const inc=tools.incense;if(overlap(el,inc,.08)){el.querySelector('.flame').style.display='block';setTimeout(()=>{inc.querySelector('.ember').style.display='block';el.querySelector('.flame').style.display='none';toast('향에 불이 붙었어!',1500);el.remove();delayNext(1800)},650)}else toast('점화기를 향의 끝부분으로 가져가 봐!',1000)}
 else toast('점선으로 표시된 위치에 놓아 보자!',900)
}
function makeSmoke(){let layer=$('#smokeLayer');layer.innerHTML='';let inc=tools.incense.getBoundingClientRect(),lr=lab.getBoundingClientRect();for(let i=0;i<17;i++){let d=document.createElement('i');d.className='smoke-dot';d.style.left=((inc.left-lr.left+35)/lr.width*100)+'%';d.style.top=((inc.top-lr.top+10)/lr.height*100)+'%';d.style.width=(13+(i%4)*3)+'px';d.style.height=d.style.width;layer.appendChild(d)}}
function runSmoke(){
 makeSmoke();let w=tools.water.getBoundingClientRect(),s=tools.sand.getBoundingClientRect();
 const waterX=(w.left+w.right)/2,sandX=(s.left+s.right)/2,dx=(waterX-sandX)*.72;
 document.querySelectorAll('.smoke-dot').forEach((d,i)=>d.animate([{opacity:0,transform:'translate(0,0) scale(.65)'},{opacity:.75,offset:.16},{opacity:.48,offset:.62},{opacity:0,transform:`translate(${dx}px,-74px) scale(1.55)`}],{duration:3600,delay:i*170,iterations:2,easing:'linear'}));
 setTimeout(()=>{showBaseArrow(sandX<waterX?'right':'left');positionPressure()},1600);setTimeout(showQuestions,6200)
}
function showBaseArrow(dir){const a=$('#windArrow');a.classList.add('show');a.querySelector('span').textContent='모래(고기압) → 따뜻한 물(저기압)';const line=a.querySelector('.line'),head=a.querySelector('.head');if(dir==='left'){line.style.background='#775fd6';head.style.right='auto';head.style.left='0';head.style.borderLeft='0';head.style.borderRight='28px solid #775fd6'}else{line.style.background='#2f9bd8';head.style.left='auto';head.style.right='0';head.style.borderRight='0';head.style.borderLeft='28px solid #2f9bd8'}}
function positionPressure(){let w=tools.water.getBoundingClientRect(),s=tools.sand.getBoundingClientRect(),lr=lab.getBoundingClientRect();let hp=$('#highP'),lp=$('#lowP');hp.style.left=((s.left-lr.left+s.width/2-65)/lr.width*100)+'%';hp.style.top='30%';lp.style.left=((w.left-lr.left+w.width/2-65)/lr.width*100)+'%';lp.style.top='30%';hp.textContent='고기압 · 차가운 모래 쪽';lp.textContent='저기압 · 따뜻한 물 쪽';hp.classList.add('show');lp.classList.add('show')}
function showQuestions(){
 step=STEPS.length;$('#progress').style.width='100%';$('#stepPill').textContent='완료';document.querySelectorAll('.step-row').forEach(r=>{r.classList.remove('active');r.classList.add('done')});$('#instIcon').textContent='💨';$('#instTitle').textContent='교과서 실험 결과';$('#instText').textContent='차가운 모래 쪽의 기압이 더 높고, 따뜻한 물 쪽의 기압이 더 낮아 향 연기가 모래에서 따뜻한 물 쪽으로 이동했어.';$('#status').textContent='결과 정리';
 const qa=[
  {q:'① 교과서 모형에서 더 따뜻한 곳은?',a:['모래가 있는 쪽','따뜻한 물이 있는 쪽'],c:1},
  {q:'② 기압이 더 높은 곳은?',a:['차가운 모래가 있는 쪽','따뜻한 물이 있는 쪽'],c:0},
  {q:'③ 향 연기와 공기가 이동하는 방향은?',a:['모래 → 따뜻한 물','따뜻한 물 → 모래'],c:0}
 ];let html='';qa.forEach((x,qi)=>html+=`<div class="question"><h3>${x.q}</h3><div class="choices">${x.a.map((a,i)=>`<button class="choice" data-q="${qi}" data-i="${i}" data-c="${x.c}">${a}</button>`).join('')}</div></div>`);$('#questionArea').innerHTML=html;document.querySelectorAll('.choice').forEach(b=>b.onclick=answerQuestion)
}
let answered=new Set();function answerQuestion(e){let b=e.currentTarget,q=+b.dataset.q,i=+b.dataset.i,c=+b.dataset.c;if(answered.has(q))return;if(i===c){b.classList.add('correct');b.textContent+=' ✓';answered.add(q);toast('정답! 👍',900);if(answered.size===3)setTimeout(showResult,1100)}else{b.classList.add('wrong');toast('한 번 더 생각해 보자!',900);setTimeout(()=>b.classList.remove('wrong'),700)}}
function showResult(){let name=$('#nameInput').value.trim();let r=document.createElement('div');r.className='result fadeIn';r.innerHTML=`<h2>🎉 ${name?name+' 학생, ':''}교과서 실험 성공!</h2><p><b>따뜻한 물 쪽</b>의 공기는 따뜻하고 가벼워 상대적으로 <b>저기압</b>, <b>차가운 모래 쪽</b>의 공기는 차갑고 무거워 상대적으로 <b>고기압</b>이 돼. 그래서 공기는 <b>고기압 → 저기압</b>, 즉 <b>모래 → 따뜻한 물</b> 쪽으로 이동해.</p><p>이제 조건을 바꾸면 바람 방향도 바뀔까? <b>해가 뜰 때·질 때, 전등으로 가열할 때, 추운 곳에 둘 때</b>를 직접 비교해 보자.</p><div class="result-actions"><button class="advanced-btn" id="advancedBtn">🧪 심화 실험실 열기</button></div>`;$('#questionArea').appendChild(r);$('#advancedBtn').onclick=openAdvancedLab}

/* ===== 심화 실험실 ===== */
let advMode='sunrise',advPrediction=null,advRunning=false;
const ADV_MODES={
 sunrise:{title:'해가 뜬다면?',desc:'해가 떠 햇빛을 받으면 육지(모래)와 바다(물)는 어떻게 달라질까? 바람 방향을 먼저 예상해 보자.',context:'☀️ 모래는 물보다 더 빨리 데워지는 성질이 있어.'},
 sunset:{title:'해가 진다면?',desc:'해가 져서 주변이 서늘해지면 육지(모래)와 바다(물)는 어떻게 달라질까? 바람 방향을 먼저 예상해 보자.',context:'🌇 모래는 물보다 더 빨리 식는 성질이 있어.'},
 heat:{title:'전등으로 가열한다면?',desc:'같은 상태의 물과 모래에 전등을 비춘다면 어느 쪽이 더 빨리 데워질까? 바람 방향을 예상해 보자.',context:'💡 전등은 가열 상황을 비교해 보기 위한 심화 모형이야. 기본 교과서 실험에는 전등이 없어.'},
 cold:{title:'추운 곳에 놓는다면?',desc:'같은 상태의 물과 모래를 추운 곳에 놓는다면 어느 쪽이 더 빨리 식을까? 바람 방향을 예상해 보자.',context:'❄️ 모래는 물보다 주변 온도의 영향을 더 빠르게 받아 식는 모습이 나타나.'},
 free:{title:'자유 조건 연구',desc:'물과 모래의 처음 온도와 주변 온도만 정해 보자. 주변이 더 따뜻한지, 더 차가운지에 따라 바람 방향을 예상할 수 있어.',context:'🔬 모래는 물보다 온도가 더 빨리 변한다는 성질을 이용해 생각해 보자.'}
};
function openAdvancedLab(){
 if($('#advancedLab')){$('#advancedLab').scrollIntoView({behavior:'smooth',block:'start'});return}
 const wrap=document.createElement('section');wrap.id='advancedLab';wrap.className='advanced-lab fadeIn';wrap.innerHTML=`<div class="advanced-head"><div><h2>🧪 심화 실험실</h2><p>수치를 정답처럼 외우지 말고, <b>상황 → 온도 변화의 빠르기 → 기압 차 → 바람 방향</b>의 관계를 생각해 보자.</p></div><div class="adv-tabs"><button class="adv-tab active" data-mode="sunrise">☀️ 해 뜸</button><button class="adv-tab" data-mode="sunset">🌇 해 짐</button><button class="adv-tab" data-mode="heat">💡 전등</button><button class="adv-tab" data-mode="cold">❄️ 추운 곳</button><button class="adv-tab" data-mode="free">🔬 자유 연구</button></div></div>
 <div class="adv-grid"><div class="adv-scene" id="advScene"><div class="adv-window"></div><div class="adv-bench"></div><div class="adv-cold" id="advCold"></div><div class="adv-sun" id="advSun"></div><div class="adv-moon" id="advMoon">🌙</div><div class="adv-env-label" id="advEnvLabel"></div><div class="adv-tank"><div class="adv-bowl water"><div class="adv-temp qualitative" id="advWaterTemp">물(바다)</div><b>물(바다)</b></div><div class="adv-bowl sand"><div class="adv-temp qualitative" id="advSandTemp">모래(육지)</div><b>모래(육지)</b></div><div class="adv-incense"><div class="adv-ember"></div></div></div><div class="adv-lamp" id="advLamp"><div class="shade"></div><div class="bulb"></div><div class="beam"></div></div><div class="adv-smoke" id="advSmoke"></div><div class="adv-arrow" id="advArrow"><span id="advArrowText"></span><div class="aline"></div><div class="ahead"></div></div></div>
 <div class="adv-controls"><h3 id="advTitle"></h3><div class="mode-explain" id="advDesc"></div><div class="adv-context" id="advContext"></div><div id="advControlsHost"></div><div class="predict-box"><b>먼저 바람 방향을 예상해 보자.</b><div class="predict-choices"><button class="predict" data-pred="ws">물(바다) → 모래(육지)</button><button class="predict" data-pred="sw">모래(육지) → 물(바다)</button><button class="predict" data-pred="none">거의 불지 않음</button></div></div><button class="adv-run" id="advRun">▶ 결과 확인하기</button><button class="adv-reset" id="advReset">↻ 다시 예상하기</button><div id="advResult"></div><div class="adv-note">※ 해 뜸·해 짐·전등·추운 곳 활동은 특정 시간이나 온도 값을 정답으로 제시하지 않아. 물과 모래가 데워지고 식는 <b>빠르기의 차이</b>를 비교하는 모형이야.</div></div></div><div class="adv-challenge">💡 <b>도전:</b> 해가 뜰 때와 해가 진 뒤 바람 방향이 왜 달라지는지 <b>물과 모래의 온도 변화 속도</b>로 설명해 보자!</div>`;
 $('#questionArea').appendChild(wrap);
 wrap.querySelectorAll('.adv-tab').forEach(b=>b.onclick=()=>setAdvMode(b.dataset.mode));
 wrap.querySelectorAll('.predict').forEach(b=>b.onclick=()=>{advPrediction=b.dataset.pred;wrap.querySelectorAll('.predict').forEach(x=>x.classList.toggle('selected',x===b))});
 $('#advRun').onclick=runAdvanced;$('#advReset').onclick=()=>setAdvMode(advMode);setAdvMode('sunrise');setTimeout(()=>wrap.scrollIntoView({behavior:'smooth',block:'start'}),80)
}
function setAdvMode(mode){
 advMode=mode;advPrediction=null;advRunning=false;
 document.querySelectorAll('.adv-tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
 document.querySelectorAll('.predict').forEach(b=>b.classList.remove('selected'));
 $('#advTitle').textContent=ADV_MODES[mode].title;$('#advDesc').textContent=ADV_MODES[mode].desc;$('#advContext').textContent=ADV_MODES[mode].context;
 $('#advResult').innerHTML='';$('#advResult').className='';$('#advArrow').className='adv-arrow';$('#advSmoke').innerHTML='';
 const host=$('#advControlsHost');
 if(mode==='free'){
  host.innerHTML=`<div class="control-row"><label>물·모래의 처음 온도 <output id="advStartOut">20℃</output></label><input id="advStart" type="range" min="5" max="35" value="20"></div><div class="control-row"><label>주변 온도 <output id="advAmbientOut">20℃</output></label><input id="advAmbient" type="range" min="-5" max="40" value="20"></div>`;
 }else{
  host.innerHTML=`<div class="simple-situation">조건 값을 따로 정하지 않아. 상황을 보고 바람 방향만 먼저 예상해 보자.</div>`;
 }
 bindAdvControls();resetAdvScene();
 $('#advReset').textContent=mode==='free'?'↻ 조건 다시 정하기':'↻ 다시 예상하기';
}
function bindAdvControls(){['advAmbient','advStart'].forEach(id=>{const el=$('#'+id);if(el)el.oninput=()=>{updateAdvLabels();previewAdvScene()}});updateAdvLabels();previewAdvScene()}
function updateAdvLabels(){const amb=$('#advAmbient'),start=$('#advStart');if(amb&&$('#advAmbientOut'))$('#advAmbientOut').textContent=amb.value+'℃';if(start&&$('#advStartOut'))$('#advStartOut').textContent=start.value+'℃'}
function previewAdvScene(){
 const scene=$('#advScene'),sun=$('#advSun'),moon=$('#advMoon'),lamp=$('#advLamp'),cold=$('#advCold');
 scene.classList.remove('sunrise','sunset');sun.className='adv-sun';moon.classList.remove('show');lamp.style.display='none';lamp.style.filter='';cold.classList.remove('show');makeSnow(0);
 $('#advWaterTemp').classList.add('qualitative');$('#advSandTemp').classList.add('qualitative');
 $('#advWaterTemp').textContent='물(바다)';$('#advSandTemp').textContent='모래(육지)';
 if(advMode==='sunrise'){scene.classList.add('sunrise');sun.classList.add('rise');$('#advEnvLabel').textContent='☀️ 해가 뜬 상황'}
 if(advMode==='sunset'){scene.classList.add('sunset');sun.classList.add('set');moon.classList.add('show');$('#advEnvLabel').textContent='🌙 해가 진 상황'}
 if(advMode==='heat'){lamp.style.display='block';$('#advEnvLabel').textContent='💡 같은 전등으로 가열'}
 if(advMode==='cold'){cold.classList.add('show');makeSnow(10);$('#advEnvLabel').textContent='❄️ 추운 곳'}
 if(advMode==='free'){
  const start=+$('#advStart').value,amb=+$('#advAmbient').value;
  $('#advWaterTemp').textContent=`처음 ${start}℃`;$('#advSandTemp').textContent=`처음 ${start}℃`;$('#advEnvLabel').textContent=`주변 ${amb}℃`;
  if(amb<start){cold.classList.add('show');makeSnow(8)}
  else if(amb>start){scene.classList.add('sunrise')}
 }
}
function resetAdvScene(){previewAdvScene();$('#advArrow').className='adv-arrow';$('#advSmoke').innerHTML='';$('#advRun').disabled=false;$('#advRun').textContent='▶ 결과 확인하기'}
function makeSnow(n){const c=$('#advCold');c.querySelectorAll('.snowflake').forEach(x=>x.remove());for(let i=0;i<n;i++){let f=document.createElement('span');f.className='snowflake';f.textContent='❄';f.style.left=(5+Math.random()*90)+'%';f.style.top=(-20-Math.random()*100)+'px';f.style.animationDelay=(-Math.random()*3)+'s';f.style.animationDuration=(2.5+Math.random()*2)+'s';c.appendChild(f)}}
function advOutcome(){
 if(advMode==='sunrise')return {dir:'ws',water:'천천히 데워짐',sand:'더 빨리 데워짐',reason:'해가 뜨면 모래(육지)가 물(바다)보다 더 빨리 데워져 육지 쪽 공기가 더 따뜻해져. 그래서 바다 쪽에서 육지 쪽으로 공기가 이동하는 모습을 생각할 수 있어.'};
 if(advMode==='sunset')return {dir:'sw',water:'천천히 식음',sand:'더 빨리 식음',reason:'해가 진 뒤에는 모래(육지)가 물(바다)보다 더 빨리 식어 육지 쪽 공기가 더 차가워져. 그래서 육지 쪽에서 바다 쪽으로 공기가 이동하는 모습을 생각할 수 있어.'};
 if(advMode==='heat')return {dir:'ws',water:'천천히 데워짐',sand:'더 빨리 데워짐',reason:'같은 전등으로 가열하면 모래가 물보다 더 빨리 데워져. 모래 쪽 공기가 상대적으로 더 따뜻해지므로 물 쪽에서 모래 쪽으로 공기가 이동하는 모습을 생각할 수 있어.'};
 if(advMode==='cold')return {dir:'sw',water:'천천히 식음',sand:'더 빨리 식음',reason:'추운 곳에서는 모래가 물보다 더 빨리 식어. 모래 쪽 공기가 상대적으로 더 차가워지므로 모래 쪽에서 물 쪽으로 공기가 이동하는 모습을 생각할 수 있어.'};
 const start=+$('#advStart').value,amb=+$('#advAmbient').value;
 if(amb>start)return {dir:'ws',water:'천천히 데워짐',sand:'더 빨리 데워짐',reason:`처음 온도(${start}℃)보다 주변 온도(${amb}℃)가 높아 두 곳이 데워지는 상황이야. 모래가 물보다 더 빨리 데워지므로 물 쪽에서 모래 쪽으로 공기가 이동하는 모습을 예상할 수 있어.`};
 if(amb<start)return {dir:'sw',water:'천천히 식음',sand:'더 빨리 식음',reason:`처음 온도(${start}℃)보다 주변 온도(${amb}℃)가 낮아 두 곳이 식는 상황이야. 모래가 물보다 더 빨리 식으므로 모래 쪽에서 물 쪽으로 공기가 이동하는 모습을 예상할 수 있어.`};
 return {dir:'none',water:'큰 변화 없음',sand:'큰 변화 없음',reason:`처음 온도와 주변 온도가 모두 ${start}℃로 같아 온도를 변화시키는 조건이 거의 없어. 이 단순한 모형에서는 뚜렷한 온도 차와 바람도 거의 나타나지 않는 것으로 생각할 수 있어.`};
}
function runAdvanced(){
 if(advRunning)return;
 if(!advPrediction){$('#advResult').className='adv-result warning';$('#advResult').textContent='먼저 바람 방향을 예상해 보고 결과를 확인해 보자!';return}
 advRunning=true;$('#advRun').disabled=true;$('#advResult').innerHTML='';
 const out=advOutcome();
 $('#advWaterTemp').textContent='변화 관찰 중…';$('#advSandTemp').textContent='변화 관찰 중…';
 setTimeout(()=>{$('#advWaterTemp').textContent=out.water;$('#advSandTemp').textContent=out.sand;finishAdvanced(out)},1200)
}
function finishAdvanced(out){
 const dir=out.dir;showAdvWind(dir);const correct=advPrediction===dir;
 $('#advResult').className='adv-result '+(correct?'':'warning');
 $('#advResult').innerHTML=`결과는 <b>${dir==='ws'?'물(바다) → 모래(육지)':dir==='sw'?'모래(육지) → 물(바다)':'거의 불지 않음'}</b>으로 생각할 수 있어. ${correct?'🎯 예상이 맞았어!':'예상과 달랐네. 어느 쪽의 온도가 더 빨리 변하는지 다시 살펴보자!'}<br><br>${out.reason}`;
 advRunning=false;$('#advRun').disabled=false;$('#advRun').textContent='▶ 다시 확인하기'
}
function showAdvWind(dir){const a=$('#advArrow');a.className='adv-arrow show '+(dir==='sw'?'reverse':dir==='none'?'none':'');$('#advArrowText').textContent=dir==='ws'?'바다(물) → 육지(모래)':dir==='sw'?'육지(모래) → 바다(물)':'뚜렷한 이동 거의 없음';makeAdvSmoke(dir)}
function makeAdvSmoke(dir){const layer=$('#advSmoke');layer.innerHTML='';for(let i=0;i<13;i++){let d=document.createElement('i');layer.appendChild(d);let dx=dir==='ws'?140:dir==='sw'?-140:(i%2?18:-18);d.animate([{opacity:0,transform:'translate(0,0) scale(.7)'},{opacity:.68,offset:.2},{opacity:.42,offset:.65},{opacity:0,transform:`translate(${dx}px,-62px) scale(1.45)`}],{duration:3000,delay:i*170,iterations:2,easing:'linear'})}}
$('#experimentMenuBtn').onclick=()=>{location.href='index.html'};$('#windRestartBtn').onclick=()=>{location.reload()};
$('#startBtn').onclick=()=>{$('#hero').style.display='none';$('#labPage').style.display='block';initSteps();updateUI();spawnStep()};
})();
</script>
</body>
</html>
